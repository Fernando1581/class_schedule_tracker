name: flutter_application_3
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  audioplayers: ^6.8.1
  alarm: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/classroom_icon.png
    - assets/lab_icon.png
    - assets/ClassMate.png
    - assets/ClassMateText.png
    - assets/bell.mp3
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ClassMate.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ClassMate.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/ClassMate.png
  android: true
  ios: true